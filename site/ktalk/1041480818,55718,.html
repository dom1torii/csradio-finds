function setCookie(name, value) {
	var exp = new Date();                                          // make new date object
	exp.setTime(exp.getTime() + (1000 * 60 * 60 * 24 * 1000));     // set it 1000 days ahead
	document.cookie = name + "=" + escape(value) + "; path=/; expires=" + exp.toGMTString();
}

function getcookie(strVariableName)
{
	
	var intNameLength;
	var intLocation;
	var intVauleLength;
	var intNextSemicolon;
	var intcookLenght;
	var strtemp;
	var strcooktemp;
	
	intNameLength = strVariableName.length;
	strcooktemp = document.cookie;
	intcookLenght = strcooktemp.length;
	intLocation = strcooktemp.indexOf(strVariableName,0);
	if (intLocation == -1)
		return null;
	strtemp = strcooktemp.substr(intLocation);
	if (strtemp.charAt(intNameLength)!="=")
		return null;
	intNextSemicolon = strtemp.indexOf(";");
	if (intNextSemicolon == -1)
		intNextSemicolon = (strtemp.length);
	if (intNextSemicolon == (strtemp.length)+1)
		return null;
	intVauleLenght = intNextSemicolon-intNameLength-1;
	strtemp = strtemp.substr(intNameLength+1,intVauleLenght);
	return strtemp;
}
</script>
